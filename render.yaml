# Render's free plan doesn't support persistent disks (that's a paid-tier
# feature) -- a `disk:` block here would silently do nothing on this plan,
# and every redeploy would reset a SQLite file on it back to empty. This
# service now runs on DATABASE_URL (Postgres/Supabase, see .env.example
# and the README's "Using Postgres / Supabase" section) instead: data
# lives in that database, not on this service's filesystem, so the free
# plan's ephemeral disk is no longer a problem, and there's no `disk:`
# block to accidentally rely on.
#
# DATABASE_URL itself must be set as a Render dashboard secret (Settings
# -> Environment) -- sync: false below means it's intentionally never
# stored in this file.
services:
  - type: web
    name: apex-pilot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
